<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priya & Divyanshu — Wedding Reception Invitation</title>
<meta name="description" content="Priya Rathore and Divyanshu Chauhan invite you to their wedding reception on Friday, 4 December 2026, Mainpuri.">
<meta property="og:title" content="Priya & Divyanshu — Wedding Invitation">
<meta property="og:description" content="You are invited to our wedding reception · 4 December 2026">
<meta name="theme-color" content="#263B30">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--forest:#263B30;--olive:#3C4938;--sage:#929C82;--lsage:#C5CBB5;--ivory:#F8F5EC;--gold:#C5A46D;--agold:#A88A55;--beige:#E8DECC;
--script:'Great Vibes','Snell Roundhand',cursive;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;background:#1b2b22;color:var(--forest);font-family:var(--serif);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden;height:100%}
svg{display:block}
#app{position:relative;max-width:520px;margin:0 auto;background:var(--ivory);overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.55)}
.lbl{font-family:var(--sans);font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;color:var(--agold)}
p{line-height:1.8;font-size:1.15rem;margin:.8rem 0}
section{position:relative;padding:5rem 1.5rem;text-align:center}
.wrap{max-width:420px;margin:0 auto}
.script{font-family:var(--script);font-weight:400}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(14px,calc(50% - 246px));right:max(14px,calc(50% - 246px));z-index:60;display:flex;justify-content:space-between;pointer-events:none;opacity:0;visibility:hidden}
body.ready #top{opacity:1;visibility:visible}
#top>*{pointer-events:auto}
.pb{width:44px;height:44px;border-radius:50%;border:1px solid rgba(197,164,109,.8);background:rgba(38,59,48,.7);backdrop-filter:blur(10px);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}.bars i{width:2px;height:4px;background:currentColor}.play .bars i{animation:eq 1s ease-in-out infinite}.play .bars i:nth-child(2){animation-delay:.25s}.play .bars i:nth-child(3){animation-delay:.5s}@keyframes eq{50%{height:14px}}
#intro{position:fixed;inset:0;z-index:100}
#intro.done{display:none}
.hd{font-family:var(--script);font-size:clamp(2.3rem,10.5vw,3.1rem);line-height:1.15;margin:.2rem 0 .3rem;color:#2C3B30}
.rv{opacity:0;transform:translateY(30px);transition:.8s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body class="lock">
<div id="intro" aria-label="Wedding invitation"><button id="md" aria-label="Tap to open your invitation">Tap to open your invitation</button></div>
<audio id="bgMusic" loop preload="auto">
  <source src="leberch-invitation-wedding-375839.mp3" type="audio/mpeg">
</audio>
<div id="top">
  <button class="pb" id="mb" aria-label="Menu" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 8h16M4 16h16"/></svg></button>
  <button class="pb" id="music" aria-label="Play music" aria-pressed="false"><span class="bars"><i></i><i></i><i></i></span></button>
</div>
<div id="app">
  <main>
    <section id="invitation"><h1 class="hd">Priya &amp; Divyanshu</h1><p>Wedding Reception · 4 December 2026</p></section>
    <section id="story" class="rv"><h2 class="hd">A New Chapter Begins</h2><p>We invite you to celebrate love, laughter and a lifetime of togetherness.</p></section>
  </main>
</div>
<script>
var music=document.getElementById("bgMusic"),musicButton=document.getElementById("music"),playing=false;
music.volume=.55;
function updateMusicUI(){
  musicButton.classList.toggle("play",playing);
  musicButton.setAttribute("aria-pressed",playing ? "true" : "false");
  musicButton.setAttribute("aria-label",playing ? "Pause music" : "Play music");
}
function startMusic(){
  music.play().then(function(){playing=true;updateMusicUI();}).catch(function(){playing=false;updateMusicUI();});
}
function stopMusic(){
  music.pause();playing=false;updateMusicUI();
}
musicButton.onclick=function(){playing?stopMusic():startMusic();};
var intro=document.getElementById("intro"),opened=false;
document.getElementById("md").onclick=function(){
  if(opened)return;opened=true;
  startMusic();
  intro.classList.add("done");
  document.body.classList.remove("lock");
  document.body.classList.add("ready");
  document.querySelectorAll(".rv").forEach(function(el){el.classList.add("in")});
};
</script>
</body>
</html>
